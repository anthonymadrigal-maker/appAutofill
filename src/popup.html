<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Internship Autofill</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <div class="popup-header">
      <img src="../icons/icon32.png" alt="" width="22" height="22" />
      <span class="popup-title">Internship Autofill</span>
    </div>

    <button id="autofillBtn" class="btn btn-primary btn-block" type="button">
      Autofill This Page
    </button>

    <div id="status" class="status"></div>

    <button id="settingsBtn" class="btn btn-ghost btn-block" type="button">
      Edit My Profile
    </button>

    <p class="footnote">Your info stays on this device and is only used when you click Autofill.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
